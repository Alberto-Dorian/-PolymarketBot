name: Polymarket Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar bot
        run: python bot.py

      - name: Guardar memoria e historial
        run: |
          git config user.name "PolymarketBot"
          git config user.email "polymarketbot@users.noreply.github.com"
          git add precios_anteriores.json historial_movimientos.json
          git diff --cached --quiet || git commit -m "Actualizar memoria e historial"
          git push
